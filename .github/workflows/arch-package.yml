name: Arch package

# Builds the cosmalia-session Arch package and attaches it to a
# GitHub release, for every release tag (v*).
#
# Triggers
#   push of a v* tag   build and publish that tag
#   workflow_dispatch  rebuild an existing tag (e.g. after fixing the packaging)
#
# The package itself is version-less: pkgver comes from the tag (v1.3.3 ->
# 1.3.3) and pkgrel from the number of commits that touched the packaging, so
# a rebuild of the same tag is still seen by pacman as an upgrade. The tag must
# match the VERSION file, which is the single source of truth for all packaging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.3.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: arch-package-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      # git has to exist before checkout, otherwise actions/checkout falls back
      # to downloading a tarball and there is no history for the pkgrel count.
      - name: Bootstrap git and gh
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git github-cli

      # Add chaotic-aur repository for COSMIC desktop packages
      - name: Add chaotic-aur repository
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          echo '[chaotic-aur]' >> /etc/pacman.conf
          echo 'Include = /etc/pacman.d/chaotic-mirrorlist' >> /etc/pacman.conf
          pacman -Sy --noconfirm

      # Install COSMIC dependencies from chaotic-aur
      - name: Install COSMIC dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed --disable-download-timeout \
            cosmic-comp \
            noctalia \
            cosmic-settings \
            cosmic-settings-daemon \
            xdg-desktop-portal-wlr \
            xdg-desktop-portal-gtk \
            xdg-desktop-portal-cosmic \
            polkit \
            gnome-keyring \
            wireplumber \
            cosmic-screenshot

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag matches VERSION
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/check-version.sh --expect "$TAG"

      - name: Build package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          version=${TAG#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag $TAG is not v<major>.<minor>.<patch>" >&2
            exit 1
          }

          # pkgrel monotonic with packaged changes: 1, 2, 3, ...
          pkgrel=$(git rev-list --count HEAD -- \
            PKGBUILD cosmalia-session.install files README.md LICENSE \
            scripts/set-default-greetd.sh)
          (( pkgrel >= 1 )) || pkgrel=1
          echo "building cosmalia-session $version-$pkgrel"

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          mkdir -p /tmp/pkgout
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkgout

          su builder -s /bin/bash -c "
            cd '$GITHUB_WORKSPACE'
            SESSION_VERSION='$version' SESSION_PKGREL='$pkgrel' \
            PKGDEST=/tmp/pkgout \
            makepkg --noconfirm --force
          "

      - name: Collect packages
        id: pkg
        run: |
          set -euo pipefail
          cd /tmp/pkgout
          shopt -s nullglob
          assets=()
          for file in *.pkg.tar.zst; do
            assets+=("$file")
          done
          (( ${#assets[@]} )) || { echo "no package was produced" >&2; exit 1; }
          printf '%s\n' "${assets[@]}" > /tmp/assets.txt
          cat /tmp/assets.txt

      - name: Write release notes
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          sed "s|{{REPOSITORY}}|${REPOSITORY}|g; s|{{TAG}}|${TAG}|g" \
            "$GITHUB_WORKSPACE/.github/release-notes-arch.md.template" \
            > /tmp/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd /tmp/pkgout
          mapfile -t assets < /tmp/assets.txt

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --verify-tag
          fi
