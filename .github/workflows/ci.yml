name: CI

# Cheap sanity checks on every push / pull request: the shell scripts pass
# shellcheck, the version is consistent across all packaging, the flake checks
# out and the PKGBUILD still builds. Releases are built by arch-package.yml and
# fedora-package.yml on v* tags.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck -s sh files/usr/bin/cosmalia-session
          shellcheck -s bash scripts/*.sh cosmalia-session.install

  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags are needed to check VERSION against releases
      - name: Check VERSION, PKGBUILD fallback and git tags
        run: ./scripts/check-version.sh
      - name: Check packaged file manifest
        run: ./scripts/check-manifest.sh

  test:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test the greetd helper
        run: sudo ./scripts/test-set-default-greetd.sh

  package:
    name: makepkg
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Bootstrap git
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git

      # Install COSMIC dependencies from official Arch extra repo
      # cosmic-comp-traffic (patched compositor) is NOT in official repos,
      # so download it from the project's GitHub releases
      - name: Install COSMIC dependencies
        run: |
          set -euo pipefail
          # Install official COSMIC packages from extra
          pacman -Syu --noconfirm --needed --disable-download-timeout \
            noctalia \
            cosmic-settings-daemon \
            cosmic-settings \
            cosmic-screenshot \
            xdg-desktop-portal-cosmic \
            xdg-desktop-portal-wlr \
            xdg-desktop-portal-gtk \
            polkit \
            gnome-keyring \
            wireplumber

          # Get version from VERSION file to download matching cosmic-comp-traffic
          # cosmalia-session 1.3.4 uses cosmic-comp-traffic 1.11.0 (epoch-1.11.0)
          cosmic_comp_version=1.11.0
          gh release download "epoch-${cosmic_comp_version}" \
            --repo grigio/cosmic-comp-traffic \
            --pattern '*.pkg.tar.zst' \
            --dir /tmp
          pacman -U --noconfirm /tmp/cosmic-comp-traffic-*.pkg.tar.zst

      - uses: actions/checkout@v6

      - name: Build
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder 2>/dev/null || true
          mkdir -p /tmp/pkgout
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkgout
          su builder -s /bin/bash -c "
            cd '$GITHUB_WORKSPACE'
            PKGDEST=/tmp/pkgout makepkg --noconfirm --force
          "
          ls -l /tmp/pkgout
          # the launcher and helper must be executable inside the package
          bsdtar -tvf /tmp/pkgout/*.pkg.tar.zst | tee /tmp/pkglist.txt
          grep -qE '^-rwxr-xr-x .*usr/bin/cosmalia-session$' /tmp/pkglist.txt
          grep -qE '^-rwxr-xr-x .*usr/bin/cosmalia-session-default$' /tmp/pkglist.txt
          for path in \
            usr/share/wayland-sessions/cosmalia.desktop \
            usr/share/xdg-desktop-portal/cosmalia-portals.conf \
            usr/lib/systemd/user/cosmalia-session.target \
            usr/lib/systemd/user/noctalia.service \
            usr/lib/systemd/user/cosmic-settings-daemon.service \
            usr/share/doc/cosmalia-session/README.md \
            usr/share/licenses/cosmalia-session/LICENSE; do
            grep -qE "^-rw-r--r-- .*${path}\$" /tmp/pkglist.txt
          done

      - name: Install/remove smoke test
        run: |
          set -euo pipefail
          pacman -U --noconfirm /tmp/pkgout/*.pkg.tar.zst
          test -x /usr/bin/cosmalia-session
          test -x /usr/bin/cosmalia-session-default
          test -f /usr/lib/systemd/user/noctalia.service
          # The post_install script must not need /etc/greetd (and must not
          # edit it). Verify the units resolve, then remove the package.
          install -d -m 700 /tmp/run
          XDG_RUNTIME_DIR=/tmp/run systemd-analyze --user verify \
            /usr/lib/systemd/user/cosmalia-session.target \
            /usr/lib/systemd/user/noctalia.service \
            /usr/lib/systemd/user/cosmic-settings-daemon.service
          pacman -R --noconfirm cosmalia-session

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Nix flake check
        run: |
          nix --extra-experimental-features "nix-command flakes" flake check
      - name: Nix build package
        run: |
          nix --extra-experimental-features "nix-command flakes" build .#cosmalia-session
      - name: Check Nix package version matches VERSION
        run: |
          set -euo pipefail
          expected=$(<VERSION)
          actual=$(nix --extra-experimental-features "nix-command flakes" \
            eval --raw .#cosmalia-session.version)
          [[ "$actual" == "$expected" ]] || {
            echo "nix package version '$actual' != VERSION '$expected'" >&2
            exit 1
          }
          echo "nix package version $actual matches VERSION"