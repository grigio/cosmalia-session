name: CI

# Cheap sanity checks on every push / pull request: the shell scripts pass
# shellcheck and the PKGBUILD still builds. Releases are built by
# arch-package.yml on v* tags.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck -s sh files/usr/bin/cosmalia-session
          shellcheck -s bash scripts/*.sh cosmalia-session.install

  package:
    name: makepkg
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Bootstrap git
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git

      # Add chaotic-aur repository for COSMIC desktop packages
      - name: Add chaotic-aur repository
        run: |
          set -euo pipefail
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          echo -e "
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist" >> /etc/pacman.conf
          pacman -Sy --noconfirm

      # Install COSMIC dependencies from chaotic-aur
      - name: Install COSMIC dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed --disable-download-timeout \
            cosmic-comp \
            noctalia \
            cosmic-settings \
            cosmic-settings-daemon \
            xdg-desktop-portal-wlr \
            xdg-desktop-portal-gnome \
            polkit \
            gnome-keyring \
            wireplumber \
            cosmic-screenshot

      - uses: actions/checkout@v6

      - name: Build
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder 2>/dev/null || true
          mkdir -p /tmp/pkgout
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkgout
          su builder -s /bin/bash -c "
            cd '$GITHUB_WORKSPACE'
            PKGDEST=/tmp/pkgout makepkg --noconfirm --force
          "
          ls -l /tmp/pkgout
          # the launcher and helper must be executable inside the package
          bsdtar -tvf /tmp/pkgout/*.pkg.tar.zst | tee /tmp/pkglist.txt
          grep -qE '^-rwxr-xr-x .*usr/bin/cosmalia-session$' /tmp/pkglist.txt
          grep -qE '^-rwxr-xr-x .*usr/bin/cosmalia-session-default$' /tmp/pkglist.txt
          for path in \
            usr/share/wayland-sessions/cosmalia.desktop \
            usr/share/xdg-desktop-portal/cosmalia-portals.conf \
            usr/lib/systemd/user/cosmalia-session.target \
            usr/lib/systemd/user/noctalia.service \
            usr/lib/systemd/user/cosmic-settings-daemon.service \
            usr/share/doc/cosmalia-session/README.md \
            usr/share/licenses/cosmalia-session/LICENSE; do
            grep -qE "^-rw-r--r-- .*${path}\$" /tmp/pkglist.txt
          done

      - name: Install/remove smoke test
        run: |
          set -euo pipefail
          pacman -U --noconfirm /tmp/pkgout/*.pkg.tar.zst
          test -x /usr/bin/cosmalia-session
          test -x /usr/bin/cosmalia-session-default
          test -f /usr/lib/systemd/user/noctalia.service
          # The post_install script must not need /etc/greetd (and must not
          # edit it). Verify the units resolve, then remove the package.
          install -d -m 700 /tmp/run
          XDG_RUNTIME_DIR=/tmp/run systemd-analyze --user verify \
            /usr/lib/systemd/user/cosmalia-session.target \
            /usr/lib/systemd/user/noctalia.service \
            /usr/lib/systemd/user/cosmic-settings-daemon.service
          pacman -R --noconfirm cosmalia-session

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Nix flake check
        run: |
          nix --extra-experimental-features "nix-command flakes" flake check
      - name: Nix build package
        run: |
          nix --extra-experimental-features "nix-command flakes" build .#cosmalia-session
