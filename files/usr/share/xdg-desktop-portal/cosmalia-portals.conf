[preferred]
# xdg-desktop-portal reads this file because the session sets
# XDG_CURRENT_DESKTOP=cosmalia:COSMIC and checks the names in that list in
# order: cosmalia-portals.conf wins over the cosmic-portals.conf shipped by
# xdg-desktop-portal-cosmic. Only one file is used, so the entries that file
# provides (default, Secret) are repeated here.
#
# COSMIC keeps the interfaces it implements (settings, access, remote
# desktop); the GNOME backend is named for FileChooser only, so apps get the
# GNOME picker (GTK4/libadwaita) instead of COSMIC's own.
# Screenshot and ScreenCast use the wlr backend because xdg-desktop-portal-cosmic
# crashes on ext_image_copy_capture_session_v1 protocol errors.
org.freedesktop.impl.portal.FileChooser=gnome
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# Deliberately not in the fallback list: xdg-desktop-portal-gnome implements
# Notification, Clipboard, GlobalShortcuts, InputCapture, Usb and more by
# talking to gnome-shell over org.gnome.Mutter.ServiceChannel, which no
# Cosmalia session runs. Listed in default=, those requests would fail instead
# of falling through to gtk.
default=wlr;gtk;

# Explicitly disable interfaces that would otherwise fall through to gnome
# and fail (no gnome-shell service channel). The GTK backend doesn't
# implement these either, so they become unavailable rather than broken.
org.freedesktop.impl.portal.Notification=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.InputCapture=none
org.freedesktop.impl.portal.Usb=none

# gnome-keyring provides the Secret portal. Its .portal file still says
# UseIn=gnome, but UseIn is deprecated; naming the backend here selects it
# without pulling in the GNOME portal or Mutter.
org.freedesktop.impl.portal.Secret=gnome-keyring

# The GTK backend implements Inhibit, but its inhibitor calls
# org.gnome.SessionManager, which no Cosmalia session provides: if it were
# selected, every inhibit request would fail. Noctalia handles idle and
# suspend itself, so keep the interface unimplemented rather than broken.
org.freedesktop.impl.portal.Inhibit=none