# Cosmalia Live (CachyOS base) — GRUB config for UEFI boot.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set default=cosmalia
set timeout=10
set timeout_style=menu

menuentry "Cosmalia Live (CachyOS LTS)" --class arch --class gnu-linux --class os --id 'cosmalia' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts \
        archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% \
        cow_spacesize=2G copytoram=auto module_blacklist=pcspkr \
        i915.modeset=1 amdgpu.modeset=1 nvme_load=yes loglevel=4 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
}

menuentry "Cosmalia Live (nomodeset fallback)" --class arch --class gnu-linux --class os --id 'cosmalia-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts \
        archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% \
        cow_spacesize=2G copytoram=auto module_blacklist=pcspkr nomodeset \
        nvme_load=yes loglevel=4 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
}

if [ "${grub_platform}" = 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
