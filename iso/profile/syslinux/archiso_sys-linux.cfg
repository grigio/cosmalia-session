LABEL cosmalia
TEXT HELP
Boot the minimal Cosmalia live desktop on BIOS.
CachyOS LTS kernel, cosmic-comp-traffic and Noctalia.
ENDTEXT
MENU LABEL Cosmalia Live (CachyOS LTS, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes loglevel=4 console=ttyS0,115200

LABEL cosmaliafb
TEXT HELP
Boot Cosmalia with kernel modesetting disabled (fallback).
ENDTEXT
MENU LABEL Cosmalia Live (nomodeset fallback, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G copytoram=auto module_blacklist=pcspkr nomodeset nvme_load=yes loglevel=4 console=ttyS0,115200
