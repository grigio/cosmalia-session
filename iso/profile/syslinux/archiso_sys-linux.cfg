LABEL cosmalia
TEXT HELP
Boot the Cosmalia live desktop on BIOS (main CachyOS kernel).
ENDTEXT
MENU LABEL Cosmalia Live (CachyOS, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes loglevel=5 console=tty0 console=ttyS0,115200 nowatchdog i8042.dumbkbd xe.enable_psr=0 xe.enable_panel_replay=0 xe.enable_fbc=0 xe.enable_dc=0 iwlwifi.power_save=0 iwlwifi.enable_ini=0

LABEL cosmaliafb
TEXT HELP
Boot with kernel modesetting disabled (fallback).
ENDTEXT
MENU LABEL Cosmalia Live (nomodeset fallback, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G copytoram=auto module_blacklist=pcspkr nomodeset nvme_load=yes loglevel=5 console=tty0 console=ttyS0,115200 nowatchdog i8042.dumbkbd
