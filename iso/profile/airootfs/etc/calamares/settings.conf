# Cosmalia live ISO — CachyOS Calamares configuration.
#
# This is an OFFLINE install: the target root is the very same squashfs that
# the live session is running from (see modules/unpackfs.conf).  No network
# access, pacstrap or package chooser is needed, so the installed system is
# exactly the Cosmalia environment you just booted.
---
modules-search: [ local ]

instances:
- id:       cosmalia
  module:   shellprocess
  config:   shellprocess_cosmalia.conf

- id:       limine_entries
  module:   shellprocess
  config:   shellprocess_limine_entries.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - removeuser
  - users
  - locale
  - keyboard
  - localecfg
  - fstab
  - networkcfg
  - displaymanager
  - hwclock
  - shellprocess@cosmalia
  - initcpio
  - bootloader
  - shellprocess@limine_entries
  - services-systemd
  - umount
- show:
  - finished

branding: cosmalia

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
