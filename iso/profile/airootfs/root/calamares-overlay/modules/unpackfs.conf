# Copy the running live environment to the target disk.  mkarchiso lays the
# image out under /run/archiso/bootmnt/<install_dir>/, which is "cosmalia"
# for this ISO (see ../profiledef.sh).
---
unpack:
    -   source: "/run/archiso/bootmnt/cosmalia/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/cosmalia/boot/x86_64/vmlinuz-linux-cachyos"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux-cachyos"
