# Services for the installed Cosmalia system.  greetd must be enabled or the
# installed system would drop to a text console (the live image gets it from
# mkarchiso, not from this module).
---
units:
   - name: "greetd"
     action: "enable"
     mandatory: true
   - name: "NetworkManager"
     action: "enable"
     mandatory: false
   - name: "bluetooth"
     action: "enable"
     mandatory: false
   - name: "systemd-timesyncd"
     action: "enable"
     mandatory: false
   - name: "fstrim.timer"
     action: "enable"
     mandatory: false
   - name: "getty@ttyS0"
     action: "enable"
     mandatory: false
   - name: "qemu-guest-agent"
     action: "enable"
     mandatory: false
   - name: "pacman-init"
     action: "disable"
     mandatory: false
