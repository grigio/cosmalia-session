# Install Limine (CachyOS Calamares' default) on both UEFI and BIOS systems.
# No efiBootLoaderVar: we do not ship a package chooser, so the choice is fixed.
---
efiBootLoader: "limine"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
loaderEntries:
  - "timeout 5"
kernelParams: [ "quiet", "nowatchdog" ]
refindKernelList: [ "linux-cachyos", "linux" ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "cosmalia"
installEFIFallback: true
installHybridGRUB: false
