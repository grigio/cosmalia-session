# The live ISO autologins liveuser through greetd.  Calamares rewrites
# /etc/greetd/config.toml for the installed system; point it at Cosmalia
# explicitly (upstream Calamares does not know about COSMIC) and keep the
# existing "greeter" user/group from the live image.
---
displaymanagers:
  - greetd

sysconfigSetup: false
basicSetup: true

defaultDesktopEnvironment:
  executable: "/usr/bin/cosmalia-session"
  desktopFile: "cosmalia"

greetd:
  greeter_user: "greeter"
  greeter_group: "greeter"
