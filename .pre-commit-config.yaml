# Pre-commit hooks for Cosmalia session
# Install: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        name: shellcheck (scripts, session launcher, install hooks)
        files: '^scripts/.*\.sh$|^files/usr/bin/.*$|.*\.install$'
        args: ['-x']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: yamllint (GitHub Actions workflow)
        files: '\.ya?ml$'
        args: ['-c', '.yamllint']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']